[package]
name = "dataviz"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
authors = ["Samet Eraslan <absameteraslan@gmail.com>"]
description = "Fast pure-Rust plotting: 120+ chart types incl. 3D (molecules, DNA, isosurfaces), genomics, trading and ML charts, interactive and live windows, animations (GIF/MP4), maps, TeX math, PNG/SVG/PDF/HTML, egui and WebAssembly. Faster and lighter than plotters in most benchmarks."
license = "MIT"
repository = "https://github.com/dataviz-rs/dataviz"
documentation = "https://docs.rs/dataviz"
keywords = ["plotting", "chart", "visualization", "plot", "graph"]
categories = ["visualization", "graphics", "science", "gui", "wasm"]
readme = "./README.md"
# The MCP server and the Claude plugin are published on their own.
exclude = [".vscode/", "mcp/", "python/", "claude-plugin/", ".claude-plugin/", "cikti/", "ROADMAP.md", "tests/golden/", "tests/golden.rs"]

[dependencies]
ab_glyph = "0.2.32"
gif = "0.14"
# Text shaping and bidi (already used by resvg/usvg).
harfrust = { version = "0.15", optional = true }
# Only the codecs used for output (no AVIF/EXR/TIFF/… encoders, no rayon).
image = { version = "0.25.6", default-features = false, features = ["png"] }
minifb = { version = "0.29", optional = true }
png = "0.18"
resvg = "0.50"
unicode-bidi = "0.3.18"
svg2pdf = { version = "0.13", optional = true }
serde_json = { version = "1", optional = true, features = ["preserve_order"] }
# Decompresses the states/provinces map (already used by png).
flate2 = { version = "1", optional = true }
wgpu = { version = "30", optional = true }

[features]
default = ["window", "formats", "full-font", "shaping", "gzip"]
# Text shaping for complex scripts (Arabic, Hebrew, Indic, Thai, …) with
# HarfRust; without it text is laid out with kerning only (+0.8 MB).
shaping = ["dep:harfrust"]
# JPEG, WebP and BMP output (PNG, SVG and PDF need nothing).
formats = ["image/jpeg", "image/webp", "image/bmp"]
# The full embedded font (DejaVu Sans, 760 KB); without it a 235 KB subset
# (Latin, Greek, Cyrillic, math and symbols) is embedded: for WebAssembly.
full-font = []
# gzip-compressed volume files (`.nii.gz`, compressed MetaImage).
gzip = ["dep:flate2"]
# Interactive windows (`Figure::show`, `Figure::show_live`); disable for headless/WASM builds.
window = ["dep:minifb"]
# PDF output (`Figure::save("x.pdf")`).
pdf = ["dep:svg2pdf"]
# States and provinces of every country (`geo_more::regions`, `Axes::region_map`; +0.8 MB).
regions = ["dep:flate2"]
# Figures from JSON specs (`plot::spec`; used by the MCP server and Python).
spec = ["dep:serde_json"]
# GPU rasterization (`Backend::Gpu`) via wgpu (Vulkan, Metal, DirectX 12, OpenGL).
gpu = ["dep:wgpu"]

[[example]]
name = "plot_interactive"
required-features = ["window"]

[dev-dependencies]
# Interoperability tests (arrays from ndarray work without a feature).
ndarray = "0.16"
# GIF decoding in the animation tests.
image = { version = "0.25.6", default-features = false, features = ["png", "gif", "webp"] }

[workspace]
members = [".", "capi", "mcp", "python", "wasm"]

# WebAssembly build of `wasm/` (the npm package): small and fast.
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
