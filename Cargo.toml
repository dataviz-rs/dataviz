[package]
name = "dataviz"
version = "0.16.0"
edition = "2021"
rust-version = "1.89"
authors = ["Samet Eraslan <absameteraslan@gmail.com>"]
description = "Fast pure-Rust plotting and charts: 50+ chart types, interactive and live windows (zoom, crosshair, range slider), animations (GIF/MP4), maps, TeX math, any language, PNG/SVG/PDF/HTML output, egui and WebAssembly embedding. Faster and lighter than plotters."
license = "MIT"
repository = "https://github.com/dataviz-rs/dataviz"
documentation = "https://docs.rs/dataviz"
homepage = "https://github.com/dataviz-rs/dataviz"
keywords = ["plotting", "chart", "visualization", "plot", "graph"]
categories = ["visualization", "graphics", "science", "gui", "wasm"]
readme = "./README.md"

[dependencies]
ab_glyph = "0.2.32"
gif = "0.14"
# Text shaping and bidi (already used by resvg/usvg).
harfrust = "0.15"
# Only the codecs used for output (no AVIF/EXR/TIFF/… encoders, no rayon).
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
minifb = { version = "0.29", optional = true }
png = "0.18"
resvg = "0.50"
unicode-bidi = "0.3.18"
svg2pdf = { version = "0.13", optional = true }
wgpu = { version = "30", optional = true }

[features]
default = ["window"]
# Interactive windows (`Figure::show`, `Figure::show_live`); disable for headless/WASM builds.
window = ["dep:minifb"]
# PDF output (`Figure::save("x.pdf")`).
pdf = ["dep:svg2pdf"]
# GPU rasterization (`Backend::Gpu`) via wgpu (Vulkan, Metal, DirectX 12, OpenGL).
gpu = ["dep:wgpu"]

[[example]]
name = "plot_interactive"
required-features = ["window"]

[dev-dependencies]
# GIF decoding in the animation tests.
image = { version = "0.25.6", default-features = false, features = ["png", "gif"] }
