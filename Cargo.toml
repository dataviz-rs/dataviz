[package]
name = "dataviz"
version = "0.13.1"
edition = "2021"
rust-version = "1.89"
authors = ["Samet Eraslan <absameteraslan@gmail.com>"]
description = "Pure-Rust plotting and data visualization: 40+ chart types (line, scatter, bar, histogram, box, violin, heatmap, contour, candlestick, pie, polar, radar, treemap, sankey, 3D, ...) to SVG, PNG, JPEG, WebP, PDF, interactive windows and the terminal."
license = "MIT"
repository = "https://github.com/dataviz-rs/dataviz"
documentation = "https://docs.rs/dataviz"
keywords = ["plot", "chart", "visualization", "graph", "svg"]
categories = ["visualization", "graphics", "science", "mathematics"]
readme = "./README.md"

[dependencies]
ab_glyph = "0.2.32"
gif = "0.14"
# Text shaping and bidi (already used by resvg/usvg).
harfrust = "0.15"
image = "0.25.6"
minifb = { version = "0.29", optional = true }
png = "0.18"
resvg = "0.50"
unicode-bidi = "0.3.18"
svg2pdf = { version = "0.13", optional = true }
wgpu = { version = "30", optional = true }

[features]
default = ["window"]
# Interactive windows (`Figure::show`, `Figure::show_live`); disable for headless/WASM builds.
window = ["dep:minifb"]
# PDF output (`Figure::save("x.pdf")`).
pdf = ["dep:svg2pdf"]
# GPU rasterization (`Backend::Gpu`) via wgpu (Vulkan, Metal, DirectX 12, OpenGL).
gpu = ["dep:wgpu"]

[[example]]
name = "plot_interactive"
required-features = ["window"]
