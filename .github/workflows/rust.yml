name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (minifb, fonts)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev fonts-dejavu-core

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (unit, integration, doc, README; all features)
        run: cargo test --all-features --verbose

      - name: Headless build (no default features)
        run: cargo build --no-default-features

      - name: MCP server and C API (clippy, tests)
        run: |
          cargo clippy -p dataviz-mcp -p dataviz-c --all-targets -- -D warnings
          cargo test -p dataviz-mcp -p dataviz-c

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Build with the minimum supported Rust version
        run: cargo build --all-targets

  # Tests on Windows and macOS (the window feature builds there without
  # extra system packages).
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (library and MCP server)
        run: |
          cargo test --features pdf
          cargo test -p dataviz-mcp

  # The C and C++ API (capi/) through CMake on every desktop OS, shared and
  # static, then the mobile targets (static libraries without windows).
  c-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        static: [OFF, ON]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> capi-build/cargo"
      - name: Configure
        run: cmake -S capi -B capi-build -DDATAVIZ_TESTS=ON -DDATAVIZ_STATIC=${{ matrix.static }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build capi-build --config Release
      - name: Test
        run: ctest --test-dir capi-build -C Release --output-on-failure

  c-api-mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-latest
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Static library for ${{ matrix.target }}
        run: cargo rustc -p dataviz-c --release --target ${{ matrix.target }} --no-default-features --crate-type staticlib
