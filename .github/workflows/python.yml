name: Python package
# Tests the Python bindings on every push; on a tag `py-vX.Y.Z` builds
# wheels for Linux, macOS and Windows (abi3: one wheel per platform for
# Python 3.9+) and publishes them to PyPI (trusted publishing: add this
# repository and workflow as a publisher of the `dataviz` project on PyPI
# once).
on:
  push:
    # Branch pushes run the tests when these paths change; tags build wheels
    # (path filters do not apply to tags).
    branches: ["**"]
    paths: ["python/**", "src/**", "Cargo.toml", ".github/workflows/python.yml"]
    tags: ["py-v*"]
  pull_request:
    paths: ["python/**", "src/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and test
        working-directory: python
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin numpy pytest
          .venv/bin/maturin develop --release
          .venv/bin/python -m pytest -q tests

  wheels:
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-14, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist

  sdist:
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
