name: dataviz-mcp release
# Push a tag `mcp-vX.Y.Z` to build the MCP server for the Claude plugin's
# launcher (claude-plugin/bin/dataviz-mcp-launcher) and attach it to the
# GitHub release of that tag.
on:
  push:
    tags: ["mcp-v*"]
  # Rebuild the binaries of an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, e.g. mcp-v0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" || gh release create "$TAG" --title "dataviz-mcp ${TAG#mcp-v}" --notes "MCP server of the dataviz Claude plugin. Install the plugin with \`/plugin marketplace add dataviz-rs/dataviz\` and \`/plugin install dataviz@dataviz\`, or the server with \`cargo install dataviz-mcp\`."

  build:
    permissions:
      contents: write
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static (musl) binaries run on any distribution, whatever
          # its glibc version.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # Intel Macs: cross-compiled on Apple silicon (older macOS images are retired).
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --release -p dataviz-mcp --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dataviz-mcp-${{ matrix.target }}.zip" dataviz-mcp.exe
            asset="dataviz-mcp-${{ matrix.target }}.zip"
          else
            strip dataviz-mcp || true
            tar -czf "dataviz-mcp-${{ matrix.target }}.tar.gz" dataviz-mcp
            asset="dataviz-mcp-${{ matrix.target }}.tar.gz"
          fi
          gh release upload "$TAG" "$asset" --clobber
