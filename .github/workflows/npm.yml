name: npm package
# Tests the WebAssembly package on every push; on a tag `npm-vX.Y.Z` builds
# it and publishes `dataviz-rs` to npm with provenance. Publishing uses npm
# trusted publishing (add this repository and workflow as a trusted
# publisher of `dataviz-rs` on npmjs.com) or, until then, an `NPM_TOKEN`
# repository secret.
on:
  push:
    branches: ["**"]
    paths: ["wasm/**", "src/**", "Cargo.toml", ".github/workflows/npm.yml"]
    tags: ["npm-v*"]
  pull_request:
    paths: ["wasm/**", "src/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Build
        run: ./wasm/build.sh
      - name: Test
        working-directory: wasm/npm
        run: node --test test.mjs
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/npm-v')
        working-directory: wasm/npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing (OIDC) needs no token; an empty one would be
          # used instead and fail, so it is set only when the secret exists.
          if [ -n "$NPM_TOKEN" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          cp ../../LICENSE .
          test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#npm-}"
          npm install -g npm@latest
          npm publish --provenance --access public
