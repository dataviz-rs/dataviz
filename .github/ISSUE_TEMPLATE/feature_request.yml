name: Feature or chart request
description: A chart type, option or API you'd like
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you'd like
      description: The chart or feature, and what you want to use it for. A link or picture of a similar chart helps.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do today
      description: How you work around it now, if at all.
