[package]
name = "dataviz-py"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "Python bindings of dataviz: fast charts from NumPy, pandas and Polars data."
license = "MIT"
repository = "https://github.com/dataviz-rs/dataviz"
publish = false

[lib]
name = "_dataviz"
crate-type = ["cdylib"]

[dependencies]
dataviz = { path = "..", default-features = false, features = ["pdf", "spec", "formats", "full-font", "shaping", "gzip"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
serde_json = "1"
